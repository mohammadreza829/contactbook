{% extends "parent/base.html" %} {% block title %}Add Contact{% endblock %} 
{%block content %}
<div class="page-header">
  <h1>Add Contact</h1>
  <a class="link" href="{% url 'contact_list' %}">← Back</a>
</div>

<form class="form" method="post">
  {% csrf_token %}

  <label class="field">
    <span>Name</span>
    <input type="text" name="name" required />
  </label>

  <label class="field">
    <span>Email</span>
    <input type="email" name="email" required />
  </label>

  <label class="field">
    <span>Phone</span>
    <input type="text" name="phone" required />
  </label>

  <label class="field">
    <span>Address</span>
    <input type="text" name="address" />
  </label>

  <button class="btn" type="submit">Save</button>
</form>
{% endblock %}
